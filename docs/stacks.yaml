# SwarmCD stacks configuration refernce
# This file should contain all the stacks
# that you want swarm-cd to keep synching

# Name of the stack, it will be used in
# the stack deploy command as the stack name
stack-name:
  # The repo that contain the stack compose file
  # and other config files
  repo: repo-name
  # The repo branch to checkout from the stack repo
  # before deploying or updating stack.
  # Use either branch OR tag, not both.
  # If neither is specified, defaults to 'main'.
  branch: main
  # Alternatively, use a git tag instead of a branch.
  # Useful for release-based deployments (e.g., v1.2.3).
  # Mutually exclusive with 'branch'.
  # tag: v1.0.0
  # The path to the docker compose file where stack
  # is defined
  compose_file: /path/to/compose.yaml
  # Path to values file to use when rendering
  # compose file as a Go template. If empty, compose
  # file will be treated as a regular compose file
  values_file: /path/to/values.yaml
  # Paths to files encrypted using sops to decrypt
  # before updating stack
  sops_files:
    - path/to/sops/encrypted/file
  # Enable the automatic secret discovery
  # alternative to sops_files
  sops_secrets_discovery: false
  # Override the global always_pull_containers setting
  # for this specific stack. When not set, uses the global
  # default. When set to true, always pulls new images.
  # When set to false, only pulls when images tags change in the stack file.
  always_pull_containers: false
  # Cron expression (5 fields, @descriptors and a CRON_TZ=<zone> prefix
  # are supported) defining when this stack may be updated. Updates happen
  # in update cycles where the schedule fired since the previous cycle,
  # e.g. "* 2-4 * * *" allows updates between 02:00 and 04:59 UTC.
  # When unset, the stack is updated on every cycle.
  # Individual services can set their own window with the
  # `swarmcd.update.window` deploy label, and their own image pull policy
  # with the `swarmcd.image.pull: always|changed` deploy label.
  update_window: "* 2-4 * * *"
